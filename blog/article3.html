      <h1>On Making Space</h1>
      <p><em>2026-08-09</em></p>
      <p>Making space — physical, mental, temporal — is a generous act toward future possibilities. It allows curiosity to surface and gives room for unplanned creativity.</p>
      <p>Often the easiest way to start is to remove one obligation, one item, or one recurring meeting.</p>
